[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/web"]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/realazk/ootrr"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
